<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国民の目｜公式公開データ</title><main><h1>国民の目｜公式公開データ</h1><p>政府の公式APIから取得したメタデータです。取得範囲・確認日時・エラー履歴はJSONに記録しています。</p><ul><li><a href="data.json">公開JSON</a></li><li><a href="records.sqlite">SQLiteデータベースと変更履歴</a></li><li><a href="https://kokkai-os.japan-business-one.chatgpt.site/database.html">国民の目で検索する</a></li></ul><p>e-Gov法令API v2、国会会議録検索API、統計ダッシュボードAPIを利用しています。</p><p>このサービスは、統計ダッシュボードのAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。</p><p>e-Stat標準APIは未接続です。人口は国勢調査／人口推計の年次値です。法令は提出法案とは異なります。発言本文は配布していません。</p></main></html>
